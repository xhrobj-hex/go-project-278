services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shorty
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: shortener
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorty -d shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    image: go-project-278
    ports:
      - "8080:8080"
      # frontend использует network_mode: service:backend,
      # поэтому порт Vite публикуется через сетевое пространство backend-контейнера
      - "5173:5173"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://shorty:secret@postgres:5432/shortener?sslmode=disable
      BASE_URL: http://localhost:8080
      FRONTEND_ORIGIN: http://localhost:5173
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:25-alpine
    working_dir: /app
    network_mode: "service:backend"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npx start-hexlet-url-shortener-frontend"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
  