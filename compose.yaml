services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shorty
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: shortener
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorty -d shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: go-project-278
    ports:
      - "8080:80"
    environment:
      PORT: "80"
      DATABASE_URL: postgres://shorty:secret@postgres:5432/shortener?sslmode=disable
      BASE_URL: http://localhost:8080
      FRONTEND_ORIGIN: http://localhost:5173
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  